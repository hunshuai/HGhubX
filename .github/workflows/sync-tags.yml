name: Sync Tags
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync tags from upstream
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/zxsos/HGhubX.git
          git fetch upstream --tags
          # 重点：失败就跳过，不中断action
          git push origin --tags || echo "部分tag已经存在，跳过冲突标签"
